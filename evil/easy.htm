<html>
<head>
  <LINK REL="stylesheet" TYPE="text/css" HREF="/style.css" />
  <title>Please remain on this page</title>
  <audio src="/sound1.mp3" autoplay loop></audio>

  <style>
    .level54-stage {
      position: relative;
      display: inline-block;
    }

    .level54-stage img {
      display: block;
      width: 606px;
      height: 808px;
    }

    .level-number {
      position: absolute;
      top: 18px;
      left: 22px;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 64px;
      font-weight: bold;
      line-height: 1;
      text-decoration: none;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }
  </style>
</head>

<body>
<center>

  <span class="level54-stage">
    <img src="screen54.jpg" width="606" height="808" border="0" alt="">
    <a class="level-number" href="#" onclick="level54Password(); return false;">54</a>
  </span>

</center>

<!-- You were specifically told not to leave. -->

<script>
(function () {
  var pieces = [60 + 7, 80 - 1, 201 / 3, 13 * 5, 71 - 4, 158 / 2, 19 * 4, 130 / 2];
  var activeTitles = [
    "Please remain on this page",
    "Oh. You're back.",
    "Please stop interrupting me.",
    "This would go faster if you listened."
  ];

  var titleIndex = 0;
  var letterIndex = 0;
  var hiddenTimer = null;
  var favicon = document.createElement("link");
  var iconCanvas = document.createElement("canvas");
  var iconContext = iconCanvas.getContext("2d");

  favicon.rel = "icon";
  iconCanvas.width = 64;
  iconCanvas.height = 64;
  document.head.appendChild(favicon);

  function answer() {
    var result = "";
    var i;

    for (i = 0; i < pieces.length; i++) {
      result += String.fromCharCode(pieces[i]);
    }

    return result.toLowerCase();
  }

  function drawIcon(mark) {
    iconContext.clearRect(0, 0, 64, 64);
    iconContext.fillStyle = "#000000";
    iconContext.fillRect(0, 0, 64, 64);
    iconContext.font = mark.length > 1 ? "bold 30px Arial" : "bold 46px Arial";
    iconContext.textAlign = "center";
    iconContext.textBaseline = "middle";
    iconContext.lineWidth = 5;
    iconContext.strokeStyle = "#000000";
    iconContext.strokeText(mark, 32, 34);
    iconContext.fillStyle = "#ffffff";
    iconContext.fillText(mark, 32, 34);
    favicon.href = iconCanvas.toDataURL("image/png");
  }

  function nextHiddenFrame() {
    var letter = String.fromCharCode(pieces[letterIndex]);
    document.title = letter;
    drawIcon(letter);
    letterIndex++;

    if (letterIndex >= pieces.length) {
      letterIndex = 0;
      hiddenTimer = window.setTimeout(function () {
        document.title = "...";
        drawIcon("?");
        hiddenTimer = window.setTimeout(nextHiddenFrame, 1900);
      }, 1500);
    } else {
      hiddenTimer = window.setTimeout(nextHiddenFrame, 1100);
    }
  }

  function beginHiddenMessage() {
    window.clearTimeout(hiddenTimer);
    letterIndex = 0;
    nextHiddenFrame();
  }

  function resumeNonsense() {
    window.clearTimeout(hiddenTimer);
    titleIndex = (titleIndex + 1) % activeTitles.length;
    document.title = activeTitles[titleIndex];
    drawIcon("54");
  }

  window.level54Password = function () {
    var attempt = window.prompt("Password:");

    if (attempt === null) {
      return;
    }

    if (attempt.toLowerCase().replace(/\s+/g, "") === answer()) {
      window.location.href = "pop.htm";
    } else {
      window.alert("Nope.");
    }
  };

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      beginHiddenMessage();
    } else {
      resumeNonsense();
    }
  });

  drawIcon("54");
}());
</script>

</body>
</html>
