<html>
 
<head>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <title>Overshot</title>  <!--  hit that key one more time -->
  <audio src="sound1.mp3" autoplay loop></audio>
  <script>
    (function () {
      var tripKey = "gopuzzler_level31_trip";

      window.addEventListener("pageshow", function () {
        if (sessionStorage.getItem(tripKey) === "forward-ready") {
          sessionStorage.removeItem(tripKey);
          window.location.replace(atob("L2p1bmlwZXIvaW5kZXguaHRt"));
        }
      });

      window.addEventListener("load", function () {
        document.body.setAttribute("tabindex", "-1");
        document.body.focus();
      });

      window.addEventListener("keydown", function (event) {
        var target = event.target;
        var isEditing = target && (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
        );

        if (event.key === "Backspace" && !isEditing) {
          event.preventDefault();
          window.history.back();
        }
      });
    }());
  </script>
</head>

 <!-- not in your browser though... -->

</body>
</html>
