<html>

<head>
  <title>Drinks at the bar</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/madfire/level6.css">
  <audio src="sound1.mp3" autoplay loop></audio>
</head>
<script>
  document.addEventListener("selectionchange", function () {
    const selection = window.getSelection();
    const trigger = document.querySelector(".select-trigger");
    const barcode = document.querySelector(".barcode-shell");

    if (!selection || selection.isCollapsed) {
      barcode.classList.remove("revealed");
      return;
    }

    const selectedInsideTrigger =
      trigger.contains(selection.anchorNode) &&
      trigger.contains(selection.focusNode);

    barcode.classList.toggle(
      "revealed",
      selectedInsideTrigger
    );
  });
</script>
<body>
  <center>
    <img
      src="yaylevel6.jpg"
      width="580"
      height="640"
      border="0"
      usemap="#mirror"
      alt="">

    <map name="mirror">
      <area
        shape="poly"
        coords="305,185,355,195,390,235,405,350,390,470,350,515,305,525,260,515,220,470,205,350,220,235,260,195"
        href="/madfire/turbo.htm"
        alt="Continue">
    </map>

    <div class="barcode-shell">
  <img
    src="scanme.png"
    class="barcode-image"
    alt="">

  <span class="select-trigger">
    drag across this hidden area to reveal what is underneath
  </span>
</div>

    <div class="direction">
      <div class="arrow">↑</div>
      <div class="direction-word">up</div>
    </div>
  </center>
</body>

</html>
