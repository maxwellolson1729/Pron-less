<html>

<head>
  <title>Drinks at the bar</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/madfire/level6.css">

  <audio src="sound1.mp3" autoplay loop></audio>
</head>
<!-- Code-128, you brighten my day -->
  
<body>
  <center>

    <img
      src="yaylevel6.jpg"
      width="580"
      height="640"
      border="0"
      usemap="#mirror"
      alt="">

    <map name="mirror">
      <area
        shape="poly"
        coords="305,185,355,195,390,235,405,350,390,470,350,515,305,525,260,515,220,470,205,350,220,235,260,195"
        href="/madfire/turbo.htm"
        alt="Continue">
    </map>
    <br><br><br>

  <!-- Ignore from here: Google -->
  <form
    method="get"
    action="https://www.google.com/search"
    target="_top">
    <input
      type="text"
      name="q"
      size="31"
      maxlength="255">
    <input
      type="submit"
      value="Search">
    <br>
    <a
      class="google-link"
      href="https://www.google.com"
      target="_blank">
      Open Google in a separate window
    </a>
  </form>
  <!-- stop ignoring: Google end -->


    <div class="panel">

      <img
        src="scanme.png"
        class="image"
        alt="">

      <span class="selection-layer">
        drag across this hidden area to reveal what is underneath
      </span>

    </div>


    <div class="direction">
      <div class="arrow">↑</div>
      <div class="direction-word">up</div>
    </div>

  </center>


  <script>
    document.addEventListener("selectionchange", function () {
      const selection = window.getSelection();
      const trigger =
        document.querySelector(".selection-layer");
      const panel =
        document.querySelector(".panel");

      if (!selection || selection.isCollapsed) {
        panel.classList.remove("revealed");
        return;
      }

      const selectedInsideTrigger =
        trigger.contains(selection.anchorNode) &&
        trigger.contains(selection.focusNode);

      panel.classList.toggle(
        "revealed",
        selectedInsideTrigger
      );
    });
  </script>

</body>

</html>
