<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="/style.css">
  <title>The Long Way Back</title>
  <audio src="sound1.mp3" autoplay loop></audio>
  <style>
    body {
      margin: 0;
      padding: 22px 10px 36px;
      background: #000;
      color: #c6a565;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .level {
      position: relative;
      width: min(800px, 100%);
      margin: 0 auto;
      line-height: 0;
    }

    .level-image {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    .route-key {
      position: absolute;
      left: 50%;
      bottom: 4.4%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: clamp(5px, 1.1vw, 11px);
      line-height: 1;
      white-space: nowrap;
    }

    .marker {
      display: grid;
      place-items: center;
      width: clamp(25px, 4.4vw, 35px);
      height: clamp(25px, 4.4vw, 35px);
      border: 1px solid #b88a3d;
      border-radius: 50%;
      background: rgba(12, 10, 8, 0.88);
      color: #e1c27b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 2.2vw, 18px);
      box-shadow:
        inset 0 0 7px rgba(211, 157, 62, 0.24),
        0 1px 4px #000;
    }

    .join {
      color: #8c6a33;
      font-size: clamp(11px, 1.9vw, 16px);
      text-shadow: 0 1px 2px #000;
    }

    .google-box {
      margin-top: 14px;
      line-height: normal;
    }

    .google-box table {
      margin: 0 auto;
    }

    .google-box a {
      color: #d0ad5f;
    }
  </style>
</head>
<body>
<center>
  <div class="level">
    <img class="level-image" src="screen39.jpg" width="1536" height="1024" border="0" alt="">
    <div class="route-key" aria-label="6, 2, 4, 2, 4, 6">
      <span class="marker">6</span><span class="join">&#9656;</span>
      <span class="marker">2</span><span class="join">&#9656;</span>

      <span class="marker">2</span><span class="join">&#9656;</span>
      <span class="marker">4</span><span class="join">&#9656;</span>
      <span class="marker">6</span>
    </div>
  </div>
