<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D</title>
  <link rel="stylesheet" href="/style.css">
  <audio src="sound1.mp3" autoplay loop></audio>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen-level {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .image-frame {
      position: relative;
      display: inline-block;
      line-height: 0;
      border: 1px solid #fff0a8;
      box-shadow: 0 0 8px 2px rgba(255, 226, 112, 0.75);
    }

    .image-frame img {
      display: block;
      width: min(600px, calc(100vw - 62px));
      height: auto;
    }

    .level-number {
      position: absolute;
      top: 14px;
      left: 17px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .print-sheet {
      display: none;
    }

    @page {
      size: letter;
      margin: 0.75in;
    }

    @media print {
      html,
      body {
        min-height: auto;
        background: #fff !important;
        color: #000 !important;
      }

      .screen-level,
      audio {
        display: none !important;
      }

      .print-sheet {
        display: block !important;
        box-sizing: border-box;
        max-width: 7in;
        margin: 0 auto;
        padding: 0.4in 0.25in;
        color: #000;
        font-family: Georgia, "Times New Roman", serif;
      }

      .print-level {
        font: 700 11pt Arial, Helvetica, sans-serif;
        letter-spacing: 0.18em;
      }

      .print-sheet h1 {
        margin: 0.15in 0 0.1in;
        font-size: 40pt;
        font-weight: 400;
      }

      .print-rule {
        border-top: 1px solid #000;
        margin: 0 0 0.45in;
      }

      .print-clue {
        margin: 0.22in 0;
        font-size: 18pt;
        line-height: 1.45;
      }

      .username-clue::after {
        content: "\004d\006f\0068\0027\0073\0020\0031\0030";
      }

      .password-clue::after {
        content: "\0043\0074\0072\006c\002b\0043";
      }
    }
  </style>
</head>
<body>
  <main class="screen-level">
    <a class="image-frame" href="/juniper/single.htm">
      <img src="screen34.jpg" alt="A glowing orange paper lantern">
      <span class="level-number">34</span>
    </a>
  </main>

  <section class="print-sheet" aria-hidden="true">
    <div class="print-level">LEVEL 34</div>
    <h1>2D</h1>
    <div class="print-rule"></div>
    <p class="print-clue"><strong>Username clue:</strong> <span class="username-clue"></span></p>
    <p class="print-clue"><strong>Password clue:</strong> <span class="password-clue"></span></p>
  </section>

  <!-- this looked better on paper... -->
</body>
</html>
