<html>
<head>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <title>See you tomorrow.</title>
  <audio src="/cute/sound1.mp3" autoplay loop></audio>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    .level47-stage {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .level47-frame {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    .level47-photo {
      display: block;
      width: auto;
      height: auto;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      border: 2px solid #e7da82;
      box-shadow:
        0 0 5px rgba(255, 239, 145, 0.95),
        0 0 14px rgba(255, 222, 92, 0.66),
        0 0 25px rgba(255, 210, 63, 0.35);
      cursor: pointer;
    }

    .level47-number {
      position: absolute;
      top: 2.1%;
      left: 3.1%;
      z-index: 2;
      color: #fff;
      font: bold clamp(24px, 4.1vh, 45px) Arial, Helvetica, sans-serif;
      line-height: 1;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Roma, MDLXXXII -->
  <div class="level47-stage">
    <span class="level47-frame">
      <a href="october4.jpg">
        <img class="level47-photo" src="october4.jpg" width="1536" height="2048" border="0" alt="">
      </a>
      <span class="level47-number">47</span>
    </span>
  </div>
</body>
</html>
