<html>
<head>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <title> Know when to fold 'em </title>
  <style>
    body {
      margin: 0;
      background: #000;
    }

    .level {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 14px;
    }

    .image-wrap {
      position: relative;
      display: inline-block;
      max-width: 96vw;
      line-height: 0;
      overflow: hidden;
      background: #000;
      cursor: default;
    }

    .image-wrap img {
      display: block;
      width: auto;
      height: auto;
      max-width: 96vw;
      max-height: calc(100vh - 28px);
      border: 0;
      filter: grayscale(1) invert(1) brightness(.16) contrast(.9);
    }

    .image-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 16%,
        rgba(0, 0, 0, .18) 48%,
        rgba(0, 0, 0, .72) 82%,
        #000 100%
      );
    }

    .image-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 1.5%;
      right: 1.5%;
      height: 1px;
      transform: translateY(-50%);
      pointer-events: none;
      background: #ff0712;
      box-shadow:
        0 0 2px #ff0712,
        0 0 6px rgba(255, 7, 18, .88),
        0 0 13px rgba(255, 7, 18, .58),
        0 0 24px rgba(255, 7, 18, .28);
    }

    .level-number {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 16px;
      color: #fff;
      font: bold 28px Arial, Helvetica, sans-serif;
      line-height: 1;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <!-- Code 128 won't help you here -->
  <div class="level">
    <div class="image-wrap">
      <img src="screen50.jpg" alt="">
      <span class="level-number">50</span>
    </div>
  </div>
</body>
</html>
