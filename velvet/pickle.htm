<html>
<head>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <title>Meet me halfway.</title>
  <style>
    body {
      margin: 0;
      background: #000;
    }

    .level {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-sizing: border-box;
      padding: 14px;
    }

    .level img {
      display: block;
      width: auto;
      height: auto;
      max-width: 96vw;
      max-height: calc(100vh - 54px);
      border: 0;
    }

    .print-link {
      color: #888;
      font: 12px Arial, Helvetica, sans-serif;
      text-decoration: none;
    }

    .print-link:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Neither half knows the answer. -->
  <div class="level">
    <img src="screen50.png" alt="">
    <a class="print-link" href="fold50.pdf" target="_blank">print</a>
  </div>
</body>
</html>
