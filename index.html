<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay Tuned</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      text-align: center;
    }

    main {
      padding: 30px;
    }

    .presented-by {
      margin: 0 0 3px;
      color: #c8b85a;
      font-family:
        "Brittany Signature",
        "Brittany",
        "Snell Roundhand",
        "Brush Script MT",
        cursive;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      font-weight: normal;
      letter-spacing: 0.03em;
      text-shadow: 0 0 7px rgba(200, 184, 90, 0.3);
    }

    .logo {
      display: block;
      width: min(520px, 82vw);
      height: auto;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    .update-note {
      margin: 0 0 36px;
      color: #aaa17a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .update-note::before,
    .update-note::after {
      margin: 0 0.45em;
      color: #625d43;
      content: "~";
    }

    .start-section,
    .donate-section {
      margin: 1em 0;
      text-align: center;
    }

    .start-row,
    .donate-row {
      position: relative;
      display: inline-block;
    }

    .version {
      position: absolute;
      top: 50%;
      left: 100%;
      margin-left: 0.65em;
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translateY(-50%);
    }

    a {
      color: #bdbdbd;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:hover {
      color: #fff;
      text-shadow: 0 0 8px #fff;
    }

    .bmc-widget-slot {
      position: absolute;
      top: 50%;
      left: 100%;
      display: inline-flex;
      width: 34px;
      height: 34px;
      margin-left: 11px;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
    }

    .bmc-widget-slot #bmc-wbtn {
      position: static !important;
      right: auto !important;
      bottom: auto !important;
      width: 34px !important;
      height: 34px !important;
      border: 1px solid rgba(225, 214, 139, 0.55) !important;
      border-radius: 50% !important;
      box-shadow: 0 0 7px rgba(200, 184, 90, 0.28) !important;
      transform: none !important;
    }

    .bmc-widget-slot #bmc-wbtn:hover {
      box-shadow: 0 0 10px rgba(225, 214, 139, 0.6) !important;
    }

    .bmc-widget-slot #bmc-wbtn img {
      width: 19px !important;
      height: 19px !important;
    }

    #bmc-iframe {
      top: 50% !important;
      right: auto !important;
      bottom: auto !important;
      left: 50% !important;
      max-width: calc(100vw - 32px) !important;
      max-height: calc(100vh - 48px) !important;
      transform: translate(-50%, -50%) !important;
      transform-origin: center !important;
    }

    #bmc-iframe[style*="opacity: 0"] {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #bmc-iframe[style*="opacity: 1"] {
      visibility: visible !important;
      pointer-events: auto !important;
    }
  </style>
</head>

<body>
  <main>
    <p class="presented-by">puzzledpuzzler presents</p>

    <img class="logo" src="/gopuzzler-logo.png" alt="GoPuzzler">

    <h1>Stay tuned</h1>
    <p class="update-note">Levels added often</p>

    <div class="start-section">
      <span class="start-row">
        <a href="/thepuzzle/index.htm">Start Puzzle</a>
        <span class="version">Beta 0.5.4</span>
      </span>
    </div>

    <a href="resources/">Resources</a>

    <p>
      <a href="/FAQ/">FAQ</a>
    </p>

    <div class="donate-section">
      <span class="donate-row">
        <a
          href="https://buymeacoffee.com/puzzledpuzzler"
          target="_blank"
          rel="noopener noreferrer"
        >Donate</a>

        <span
          class="bmc-widget-slot"
          id="bmc-widget-slot"
        ></span>
      </span>
    </div>
  </main>

  <script
    data-name="BMC-Widget"
    data-cfasync="false"
    src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
    data-id="puzzledpuzzler"
    data-description="Support GoPuzzler on Buy Me a Coffee!"
    data-message=""
    data-color="#c8b85a"
    data-position="Right"
    data-x_margin="18"
    data-y_margin="18">
  </script>

  <script>
    (function () {
      const slot = document.getElementById("bmc-widget-slot");

      function placeCoffeeButton() {
        const button = document.getElementById("bmc-wbtn");

        if (!button || !slot) {
          return false;
        }

        slot.appendChild(button);
        button.setAttribute("role", "button");
        button.setAttribute("tabindex", "0");
        button.setAttribute(
          "aria-label",
          "Open the GoPuzzler donation form"
        );
        button.setAttribute("title", "Help keep the web haunted");

        button.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            button.click();
          }
        });

        return true;
      }

      if (!placeCoffeeButton()) {
        const observer = new MutationObserver(function () {
          if (placeCoffeeButton()) {
            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          childList: true
        });
      }
    }());
  </script>
</body>
</html>
