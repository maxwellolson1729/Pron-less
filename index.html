
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay Tuned, Puzzlers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      text-align: center;
    }

    main {
      padding: 30px;
    }

    .logo {
      display: block;
      width: min(520px, 82vw);
      height: auto;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    .update-note {
      margin: 0 0 36px;
      color: #777;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .version {
      margin-left: 0.65em;
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    a {
      color: #aaa;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:hover {
      color: #fff;
      text-shadow: 0 0 8px #fff;
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="/gopuzzler-logo.png" alt="GoPuzzler">
    <h1>Stay tuned, puzzlers</h1>
    <p class="update-note">Levels added often</p>
    <p>
      <a href="/thepuzzle/index.htm">Start Puzzle</a>
      <span class="version">Beta 0.4.3</span>
    </p>
    <a href="resources/">Resources</a>
    <p>
      <a href="/FAQ/">FAQ</a>
    </p>
  </main>
</body>
</html>
